name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: py${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (dev extras)
        run: pip install -e ".[dev]" ruff
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Tests (framework + showcases)
        run: python -m pytest tests/ ledger/tests cadence/tests forge/tests -q
      - name: Static handler audit
        run: python -m ikarem.cli check ledger.app:app

  coverage:
    name: coverage floor (ikarem/ only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (dev extras + coverage)
        run: pip install -e ".[dev]" coverage pytest
      - name: Coverage (fail under 80%)
        run: coverage run -m pytest tests/ ledger/tests cadence/tests forge/tests -q && coverage report --include="ikarem/*" --fail-under=80

  differential:
    name: differential proof (pydantic + PyJWT, test-only deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (+ rival implementations)
        run: pip install -e . pydantic pyjwt pytest
      - name: Agreement tests (verdicts, values, both token directions, seam)
        run: python -m pytest tests/test_differential.py -q
      - name: Honest single-body bench
        run: python bench/bench_validate.py

  postgres:
    name: live Postgres strategy
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (+ asyncpg)
        run: pip install -e . asyncpg pytest
      - name: Live strategy tests
        run: python -m pytest tests/test_postgres_live.py -q
        env:
          IKAREM_TEST_PG_URL: postgresql://postgres:postgres@localhost:5432/postgres

  docker:
    name: showcase image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build ledger image
        run: docker build ./ledger -t ledger:ci

  scaffold:
    name: starter template stays runnable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (dev extras)
        run: pip install -e ".[dev]" ruff
      - name: Scaffold + run template tests
        run: |
          python -m ikarem.cli new /tmp/ikarem-starter
          python -m pytest /tmp/ikarem-starter/tests -q
      - name: Bench smoke (numbers informational, failures must surface)
        run: python bench/bench_switch.py
