name: Publish

on:
  push:
    tags: ["v*", "pentest-v*", "oauth-v*", "backup-v*"]

permissions:
  contents: read

jobs:
  publish-core:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build
        run: pip install build && python -m build
      - name: Publish via Trusted Publisher (no long-lived API token)
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-pentest:
    if: startsWith(github.ref, 'refs/tags/pentest-v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build
        run: pip install build && python -m build
        working-directory: extensions/ikarem-pentest
      - name: Publish via Trusted Publisher (no long-lived API token)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: extensions/ikarem-pentest/dist/

  publish-oauth:
    if: startsWith(github.ref, 'refs/tags/oauth-v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build
        run: pip install build && python -m build
        working-directory: extensions/ikarem-oauth
      - name: Publish via Trusted Publisher (no long-lived API token)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: extensions/ikarem-oauth/dist/

  publish-backup:
    if: startsWith(github.ref, 'refs/tags/backup-v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build
        run: pip install build && python -m build
        working-directory: extensions/ikarem-backup
      - name: Publish via Trusted Publisher (no long-lived API token)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: extensions/ikarem-backup/dist/
