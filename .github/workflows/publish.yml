name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build
        run: pip install build && python -m build
      - name: Publish via Trusted Publisher (no long-lived API token)
        uses: pypa/gh-action-pypi-publish@release/v1
