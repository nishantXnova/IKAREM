name: Feature request
description: Propose an addition to the framework.
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: {label: Problem, description: What can't you build cleanly today?}
    validations: {required: true}
  - type: textarea
    id: api
    attributes: {label: Proposed API, description: Sketch the handler/middleware/config shape.}
    validations: {required: true}
  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints
      options:
        - label: Zero-dep core preserved (stdlib only, lazy optional imports)
        - label: Includes test + doc sketch
