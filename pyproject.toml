[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ikarem"
version = "1.3.0"
description = "Zero-dependency Python ASGI framework: DI, validation, JWT auth, OpenAPI, MCP tools, queues, NISH."
readme = "README.md"
authors = [{ name = "Nishant Paudel" }]
requires-python = ">=3.10"
license = "MIT"
dependencies = []
keywords = [
  "asgi",
  "web framework",
  "rest api",
  "validation",
  "jwt",
  "authentication",
  "openapi",
  "mcp",
  "model context protocol",
  "websockets",
  "sqlite",
  "background tasks",
  "rate limiting",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Internet :: WWW/HTTP :: ASGI",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://ikarem.vercel.app/"
Documentation = "https://ikarem.vercel.app/guide"
Repository = "https://github.com/nishantXnova/IKAREM"
Changelog = "https://github.com/nishantXnova/IKAREM/blob/main/CHANGELOG.md"
Issues = "https://github.com/nishantXnova/IKAREM/issues"

[project.optional-dependencies]
server = ["uvicorn>=0.54.0"]
redis = ["redis>=5"]
otel = ["opentelemetry-sdk>=1.20"]
sqlite = []
postgres = ["asyncpg>=0.29"]
mysql = ["aiomysql>=0.2"]
sqlserver = ["aioodbc>=0.5"]
test = ["pytest>=8", "httpx>=0.27"]
dev = ["uvicorn>=0.54.0", "pytest>=8", "httpx>=0.27", "jinja2>=3.1"]
jinja = ["jinja2>=3.1"]

[project.scripts]
ikarem = "ikarem.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ikarem*"]

[tool.setuptools.package-data]
ikarem = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["ikarem", "ledger"]
