[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ikarem"
version = "1.1.0"
description = "IKAREM — Meraki reversed. Lightweight, modular Python ASGI backend framework."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.optional-dependencies]
server = ["uvicorn>=0.24"]
redis = ["redis>=5"]
sqlite = []
postgres = ["asyncpg>=0.29"]
mysql = ["aiomysql>=0.2"]
sqlserver = ["aioodbc>=0.5"]
test = ["pytest>=8", "httpx>=0.27"]
dev = ["uvicorn>=0.24", "pytest>=8", "httpx>=0.27", "jinja2>=3.1"]
jinja = ["jinja2>=3.1"]

[project.scripts]
ikarem = "ikarem.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ikarem*"]

[tool.setuptools.package-data]
ikarem = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["ikarem", "ledger"]
