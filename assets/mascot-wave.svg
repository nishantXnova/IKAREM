<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440">
  <!-- K-REM v2: antenna, high wave, no face slash -->
  <!-- legs -->
  <line x1="170" y1="340" x2="170" y2="384" stroke="#1d1d1f" stroke-width="22" stroke-linecap="round"/>
  <line x1="230" y1="340" x2="230" y2="384" stroke="#1d1d1f" stroke-width="22" stroke-linecap="round"/>
  <!-- body -->
  <rect x="130" y="238" width="140" height="112" rx="34" fill="#0071e3"/>
  <!-- resting arm (left) -->
  <path d="M132 262 C104 272 100 300 112 318" fill="none" stroke="#1d1d1f" stroke-width="20" stroke-linecap="round"/>
  <!-- waving arm (right): high and clear of the head, circle hand -->
  <path d="M268 260 C310 244 330 210 328 166" fill="none" stroke="#1d1d1f" stroke-width="20" stroke-linecap="round"/>
  <circle cx="328" cy="148" r="17" fill="#1d1d1f"/>
  <!-- antenna -->
  <line x1="200" y1="40" x2="200" y2="12" stroke="#1d1d1f" stroke-width="10" stroke-linecap="round"/>
  <circle cx="200" cy="10" r="11" fill="#FF2B2B"/>
  <!-- head: logo tile -->
  <rect x="100" y="40" width="200" height="200" rx="56" fill="#1d1d1f"/>
  <!-- eyes -->
  <circle cx="162" cy="130" r="21" fill="#ffffff"/>
  <circle cx="238" cy="130" r="21" fill="#ffffff"/>
  <circle cx="167" cy="134" r="8" fill="#1d1d1f"/>
  <circle cx="243" cy="134" r="8" fill="#1d1d1f"/>
  <!-- smile -->
  <path d="M170 178 Q200 200 230 178" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
</svg>
