[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ikarem-backup"
version = "0.1.0"
description = "SQLite backups for IKAREM apps: scheduled dumps, restore drills, retention, pluggable upload. Stdlib only."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["ikarem>=1.3.0"]
keywords = [
  "backup",
  "sqlite",
  "restore",
  "disaster recovery",
  "asgi",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ikarem_backup*"]
