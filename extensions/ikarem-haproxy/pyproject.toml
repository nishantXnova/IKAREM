[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ikarem-haproxy"
version = "0.1.0"
description = "IKAREM-aware HAProxy edge: config generated from compiled plans. Stdlib only."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["ikarem>=1.3.0"]
keywords = [
  "haproxy",
  "reverse-proxy",
  "tls",
  "load-balancing",
  "asgi",
]

[project.scripts]
ikarem-haproxy = "ikarem_haproxy.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ikarem_haproxy*"]
